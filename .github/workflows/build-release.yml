name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g., v2.5.1)'
        required: true

env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  build:
    runs-on: windows-2025-vs2026
    strategy:
      matrix:
        framework: [net10.0-windows, net481]
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[18.0,19.0)'

      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      - name: Run regression checks
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          msbuild tests/ExplorerTabUtility.Regression/ExplorerTabUtility.Regression.csproj /restore /p:Configuration=Release /p:TargetFramework=${{ matrix.framework }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "tests/ExplorerTabUtility.Regression/bin/Release/${{ matrix.framework }}/ExplorerTabUtility.Regression.exe"
          exit $LASTEXITCODE

      - name: Publish and zip portable build
        id: package
        shell: pwsh
        env:
          FRAMEWORK: ${{ matrix.framework }}
          ARCH: ${{ matrix.arch }}
        run: |
          if ($env:VERSION -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$') {
            throw 'Expected a release tag such as v2.5.1.'
          }
          $output = Join-Path $env:RUNNER_TEMP "publish/$env:FRAMEWORK/$env:ARCH/ExplorerTabUtility"
          msbuild ExplorerTabUtility/ExplorerTabUtility.csproj /restore /t:Publish /p:Configuration=Release "/p:TargetFramework=$env:FRAMEWORK" "/p:RuntimeIdentifier=win-$env:ARCH" "/p:PublishDir=$output" "/p:Version=$($env:VERSION.Substring(1))" /p:DebugType=none
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $flavor = if ($env:FRAMEWORK -eq 'net10.0-windows') { 'Net10.0_FrameworkDependent' } else { 'NetFW4.8.1' }
          $zip = "ExplorerTabUtility_${env:VERSION}_${env:ARCH}_$flavor.zip"
          Compress-Archive -LiteralPath $output -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

  build-installer:
    needs: build
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compile installer
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath artifacts -Filter '*.zip' -File | ForEach-Object {
            Expand-Archive -LiteralPath $_.FullName -DestinationPath (Join-Path $_.DirectoryName $_.BaseName)
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION" '/DSourceDir=..\artifacts' installers/installer.iss
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: artifacts/ExplorerTabUtility_${{ env.VERSION }}_Setup.exe
          if-no-files-found: error

  create-release:
    needs: build-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Verify and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $prefix = "ExplorerTabUtility_${env:VERSION}"
          $expected = @(
            "${prefix}_Setup.exe"
            "${prefix}_x64_Net10.0_FrameworkDependent.zip"
            "${prefix}_arm64_Net10.0_FrameworkDependent.zip"
            "${prefix}_x64_NetFW4.8.1.zip"
            "${prefix}_arm64_NetFW4.8.1.zip"
          )
          $assets = @(Get-ChildItem -LiteralPath release-artifacts -File)
          if (Compare-Object $expected $assets.Name) {
            throw 'Expected one installer and four portable builds.'
          }
          $notes = 'One Windows installer and four portable builds for x64 and ARM64, targeting .NET 10 or .NET Framework 4.8.1. The binaries are unsigned.'
          gh release create $env:VERSION --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "ExplorerTabUtility $env:VERSION" --notes $notes --draft @($assets.FullName)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uploaded = gh release view $env:VERSION --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Compare-Object $expected $uploaded.assets.name) {
            throw 'The draft does not contain the expected five assets.'
          }
          gh release edit $env:VERSION --repo $env:GITHUB_REPOSITORY --draft=false
          exit $LASTEXITCODE
